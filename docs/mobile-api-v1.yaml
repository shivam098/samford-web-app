# GENERATED from shared/mobile-contract.ts by "npm run contract". Edit the TypeScript source, not this file.
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Samford paperless OPD mobile API (synthetic mock backend)
  version: 1.0.0
  description: "Contract for the Samford doctor tablet and patient Android apps. PUBLIC SYNTHETIC DEMO: no real patient data, SMS, payment, clinical signing or production authentication. See docs/mobile-sync.md for synchronization, idempotency, authorization and limits."
servers:
  - url: https://{tunnelHost}/api/mobile/v1
    variables:
      tunnelHost:
        default: example.trycloudflare.com
        description: Read the current apiBaseUrl from the discovery gist.
  - url: http://10.0.2.2:4320/api/mobile/v1
    description: Isolated backend reached from an Android emulator.
tags:
  - name: Common
    description: Metadata and token lifecycle shared by both apps.
  - name: Doctor
    description: "Doctor tablet: personas, queue, record review, visit completion, addenda and events."
  - name: Patient
    description: "Patient app: OTP sign-in, family profiles, records, feeds and notifications."
  - name: Blobs
    description: Immutable content-addressed page PNGs, PDFs and ink.
security:
  - bearerAuth: []
paths:
  /meta:
    get:
      operationId: getMeta
      tags:
        - Common
      security: []
      summary: Server metadata and minimum app versions
      description: Unauthenticated. Use it to validate a discovered or manually entered base URL.
      responses:
        "200":
          description: Metadata
          headers:
            X-Request-Id:
              description: Request correlation ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
  /session:
    get:
      operationId: getSession
      tags:
        - Common
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      summary: Validate the current token
      responses:
        "200":
          description: Session
          headers:
            X-Request-Id:
              description: Request correlation ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "426":
          $ref: "#/components/responses/E426"
        "429":
          $ref: "#/components/responses/E429"
    delete:
      operationId: deleteSession
      tags:
        - Common
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      summary: Sign out and revoke this token
      description: Idempotent; a second call with the already revoked token returns 204.
      responses:
        "204":
          description: Revoked
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
  /doctor/personas:
    get:
      operationId: listDoctorPersonas
      tags:
        - Doctor
      security: []
      summary: Synthetic consultant personas
      description: Public demo personas only, the same identities as the web app. Not production authentication.
      responses:
        "200":
          description: Personas
          headers:
            ETag:
              description: Entity tag of this representation. Send it back as If-None-Match.
              schema:
                type: string
            X-Request-Id:
              description: Request correlation ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaList"
