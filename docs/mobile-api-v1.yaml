          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "304":
          description: "Not modified: the If-None-Match tag still matches."
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "426":
          $ref: "#/components/responses/E426"
        "429":
          $ref: "#/components/responses/E429"
  /patient/documents/{documentId}:
    get:
      operationId: getDocumentForPatient
      tags:
        - Patient
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/DocumentId"
      summary: Document detail with every version
      responses:
        "200":
          description: Document
          headers:
            ETag:
              description: Entity tag of this representation. Send it back as If-None-Match.
              schema:
                type: string
            X-Request-Id:
              description: Request correlation ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicalDocument"
        "304":
          description: "Not modified: the If-None-Match tag still matches."
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "404":
          $ref: "#/components/responses/E404"
        "426":
          $ref: "#/components/responses/E426"
        "429":
          $ref: "#/components/responses/E429"
  /patient/documents/{documentId}/viewed:
    post:
      operationId: markDocumentViewed
      tags:
        - Patient
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DocumentId"
      summary: Acknowledge that the patient opened a document version
      description: The doctor sees the PATIENT recipient move to VIEWED. Repeating it is harmless.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewedRequest"
      responses:
        "200":
          description: Recorded
          headers:
            X-Request-Id:
              description: Request correlation ID.
              schema:
                type: string
            Idempotent-Replayed:
              description: Present with value true when the stored original response was replayed.
              schema:
                const: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewedResponse"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "426":
          $ref: "#/components/responses/E426"
        "429":
          $ref: "#/components/responses/E429"
  /patient/notifications:
    get:
      operationId: pollNotifications
      tags:
        - Patient
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      summary: Poll notifications across all linked profiles
      description: Push (FCM) is out of scope. Poll in the foreground and with periodic background work; 304 means nothing new.
      responses:
        "200":
          description: Notifications
          headers:
            ETag:
              description: Entity tag of this representation. Send it back as If-None-Match.
              schema:
                type: string
            X-Request-Id:
              description: Request correlation ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "304":
          description: "Not modified: the If-None-Match tag still matches."
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "426":
          $ref: "#/components/responses/E426"
        "429":
          $ref: "#/components/responses/E429"
  /blobs/{sha256}:
    put:
      operationId: putBlob
      tags:
        - Blobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/Sha256"
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            enum:
              - image/png
              - application/pdf
              - application/vnd.samford.ink+json
      summary: Upload an immutable content-addressed blob (doctor only)
      description: The server verifies the SHA-256, size (PNG 10 MiB, PDF 25 MiB, ink 16 MiB), and the real PNG, PDF or JSON structure. Uploading identical bytes again returns 200. Idempotency-Key is optional here.
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
          application/vnd.samford.ink+json:
            schema:
              type: object
      responses:
        "200":
          description: Already stored
          headers:
            X-Request-Id:
              description: Request correlation ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlobReceipt"
        "201":
          description: Stored
          headers:
            X-Request-Id:
              description: Request correlation ID.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlobReceipt"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "413":
          $ref: "#/components/responses/E413"
        "415":
          $ref: "#/components/responses/E415"
        "422":
          $ref: "#/components/responses/E422"
        "426":
          $ref: "#/components/responses/E426"
        "429":
          $ref: "#/components/responses/E429"
    head:
      operationId: headBlob
      tags:
        - Blobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/Sha256"
      summary: Check whether a blob is already stored (doctor only)
      responses:
        "200":
          description: Stored
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          description: Not stored
    get:
      operationId: getBlob
      tags:
        - Blobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/Sha256"
        - $ref: "#/components/parameters/IfNoneMatch"
      summary: Read a blob you are authorized to see
      description: Pharmacy, lab, patient and doctor access is derived from the documents that reference the blob. Responses are immutable and cacheable.
      responses:
        "200":
          description: Bytes
          headers:
            ETag:
              description: Entity tag of this representation. Send it back as If-None-Match.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.samford.ink+json:
              schema:
                type: object
        "304":
          description: "Not modified: the If-None-Match tag still matches."
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "404":
          $ref: "#/components/responses/E404"
        "426":
          $ref: "#/components/responses/E426"
        "429":
          $ref: "#/components/responses/E429"
  /files/{sha256}:
    get:
      operationId: getSignedFile
      tags:
        - Blobs
      security: []
      parameters:
        - $ref: "#/components/parameters/Sha256"
        - name: exp
          in: query
          required: true
          schema:
            type: integer
        - name: sig
          in: query
          required: true
          schema:
            type: string
      summary: Read a blob through a short-lived signed URL
      description: URLs come from document responses (pages[].url, pdfUrl, inkUrl). They expire after 15 minutes.
      responses:
        "200":
          description: Bytes
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Device-bound opaque token. Every authenticated request must also send X-Device-Id.
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{8,128}$
      description: Must equal the deviceId used when the token was issued.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,128}$
      description: Required on every POST. UUID recommended. See docs/mobile-sync.md.
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
      description: Opaque nextCursor from the previous page. Omit to start from the beginning.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Sha256:
      name: sha256
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Sha256"
    QueueEntryId:
      name: queueEntryId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,120}$
        description: Queue entry ID.
    VisitId:
      name: visitId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,120}$
        description: Visit ID.
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,120}$
        description: Patient ID.
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,120}$
        description: Profile ID.
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,120}$
        description: Document ID.
  responses:
    E400:
      description: Malformed request, missing Idempotency-Key or X-Device-Id, or invalid cursor.
      headers:
        X-Request-Id:
          description: Request correlation ID.
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E401:
      description: Missing, invalid, expired or revoked token; device mismatch; wrong OTP.
      headers:
        X-Request-Id:
          description: Request correlation ID.
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E403:
      description: Authenticated but not permitted, for example no care relationship.
      headers:
        X-Request-Id:
          description: Request correlation ID.
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E404:
      description: Not found or outside your scope.
      headers:
        X-Request-Id:
          description: Request correlation ID.
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E409:
      description: State conflict, for example MISSING_BLOBS, VISIT_ALREADY_COMPLETED or NOT_LATEST_VERSION.
      headers:
        X-Request-Id:
          description: Request correlation ID.
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E413:
      description: Payload too large.
      headers:
        X-Request-Id:
          description: Request correlation ID.
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E415:
      description: Unsupported media type.
      headers:
        X-Request-Id:
          description: Request correlation ID.
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E422:
      description: Validation failed, hash mismatch or Idempotency-Key reused with a different request.
      headers:
        X-Request-Id:
          description: Request correlation ID.
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E426:
      description: This app version is below the minimum. Update the app.
      headers:
        X-Request-Id:
          description: Request correlation ID.
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E429:
      description: Rate limited; see Retry-After.
      headers:
        X-Request-Id:
          description: Request correlation ID.
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    E500:
      description: Unexpected server error; retry later.
      headers:
        X-Request-Id:
          description: Request correlation ID.
          schema:
            type: string
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable machine-readable code. See docs/mobile-sync.md.
            message:
              type: string
              description: Plain-language message suitable for display.
            retryable:
              type: boolean
              description: True when retrying the identical request later may succeed.
            details:
              type: object
              description: Code-specific structured details, for example MISSING_BLOBS.details.missing.
            requestId:
              type: string
              description: Correlates with the X-Request-Id response header and server audit.
          required:
            - code
            - message
            - retryable
      required:
        - error
    Sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: Lowercase hexadecimal SHA-256 of the exact blob bytes.
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 instant in UTC, for example 2026-11-21T04:05:06.000Z.
    LocalDate:
      type: string
      format: date
      description: Hospital calendar date in Asia/Kolkata, YYYY-MM-DD.
    Sex:
      type: string
      enum:
        - Female
        - Male
        - Other
    DocumentType:
      type: string
      enum:
        - VISIT_SUMMARY
        - PRESCRIPTION
        - INVESTIGATIONS
        - ADVICE_REFERRAL
        - OTHER
    DeliveryState:
      type: string
      enum:
        - AVAILABLE
        - VIEWED
        - DISPENSED
        - PARTIALLY_DISPENSED
        - NOT_DISPENSED
        - SAMPLE_COLLECTED
        - RESULT_READY
        - SUPERSEDED
      description: Server delivery state. Clients may additionally show their own local PENDING state before upload.
    QueueStatus:
      type: string
      enum:
        - BOOKED
        - WAITING
        - CALLED
        - IN_CONSULTATION
        - ON_HOLD
        - COMPLETED
        - MISSED
        - CANCELLED
    RecipientKind:
      type: string
      enum:
        - PHARMACY
        - LAB
        - PATIENT
    Meta:
      type: object
      properties:
        apiVersion:
          type: string
          description: Semantic version of this v1 contract. Minor and patch versions only add fields.
        serverVersion:
          type: string
        synthetic:
          const: true
        minDoctorAppVersion:
          type: integer
          minimum: 1
          description: Minimum doctor-android versionCode.
        minPatientAppVersion:
          type: integer
          minimum: 1
          description: Minimum patient-android versionCode.
        serverTime:
          $ref: "#/components/schemas/Timestamp"
        docsUrl:
          type: string
      required:
        - apiVersion
        - serverVersion
        - synthetic
        - minDoctorAppVersion
        - minPatientAppVersion
        - serverTime
        - docsUrl
    Persona:
      type: object
      properties:
        personaId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,120}$
          description: Doctor persona ID. Identical to doctorId everywhere else.
        doctorId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,120}$
          description: Same value as personaId.
        name:
          type: string
        qualification:
          type: string
        registrationNo:
          type: string
        department:
          type: string
        departmentId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,120}$
          description: Department ID.
      required:
        - personaId
        - doctorId
        - name
        - qualification
        - registrationNo
        - department
        - departmentId
    PersonaList:
      type: object
      properties:
        personas:
          type: array
          items:
            $ref: "#/components/schemas/Persona"
      required:
        - personas
    DoctorSessionRequest:
      type: object
      properties:
        personaId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,120}$
          description: A persona from GET /doctor/personas.
        deviceId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{8,128}$
        deviceName:
          type: string
          maxLength: 80
      required:
        - personaId
        - deviceId
      additionalProperties: false
    DoctorSession:
      type: object
      properties:
        token:
          type: string
          description: Opaque bearer token. Store securely; never log it.
        tokenType:
          const: Bearer
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        deviceId:
          type: string
        doctor:
          $ref: "#/components/schemas/Persona"
      required:
        - token
        - tokenType
        - expiresAt
        - deviceId
        - doctor
    PatientAccount:
      type: object
      properties:
        accountId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,120}$
          description: Patient-app account linked to the mobile number.
        mobileMasked:
          type: string
          description: For example ******0001.
      required:
        - accountId
        - mobileMasked
    SessionInfo:
      type: object
      properties:
        kind:
          type: string
          enum:
            - DOCTOR
            - PATIENT
        deviceId:
          type: string
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        doctor:
          $ref: "#/components/schemas/Persona"
        account:
          $ref: "#/components/schemas/PatientAccount"
      required:
        - kind
        - deviceId
        - expiresAt
    Lab:
      type: object
      properties:
        labId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,120}$
          description: Lab identifier used in routing.labs.
        name:
          type: string
        kind:
          type: string
          enum:
            - PATHOLOGY
            - IMAGING
            - OTHER
      required:
        - labId
        - name
        - kind
    LabList:
      type: object
      properties:
        labs:
          type: array
          items:
            $ref: "#/components/schemas/Lab"
      required:
        - labs
    Allergy:
      type: object
      properties:
        substance:
          type: string
        reaction:
          type: string
        certainty:
          type: string
      required:
        - substance
        - reaction
        - certainty
    Vitals:
      type: object
      properties:
        bp:
          anyOf:
            - type: string
              description: Systolic/diastolic mmHg, for example 120/80.
            - type: "null"
        pulse:
          anyOf:
            - type: integer
            - type: "null"
        tempC:
          anyOf:
            - type: number
            - type: "null"
        spo2:
          anyOf:
            - type: integer
            - type: "null"
        weightKg:
          anyOf:
            - type: number
            - type: "null"
        recordedAt:
          $ref: "#/components/schemas/Timestamp"
      required:
        - bp
        - pulse
        - tempC
        - spo2
        - weightKg
        - recordedAt
    PatientSummary:
      type: object
      properties:
        patientId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,120}$
          description: Patient ID; equals profileId in the patient app.
        uhid:
          type: string
        name:
          type: string
        age:
          type: integer
        sex:
          $ref: "#/components/schemas/Sex"
        mobileMasked:
          type: string
      required:
        - patientId
        - uhid
        - name
        - age
        - sex
        - mobileMasked
    QueuePatient:
      type: object
      properties:
        patientId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,120}$
          description: Patient ID.
        uhid:
          type: string
        name:
          type: string
        age:
          type: integer
        sex:
          $ref: "#/components/schemas/Sex"
        mobileMasked:
          type: string
        allergies:
          type: array
          items:
            $ref: "#/components/schemas/Allergy"
      required:
        - patientId
        - uhid
        - name
        - age
        - sex
        - mobileMasked
        - allergies
    QueueEntry:
      type: object
      properties:
        queueEntryId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,120}$
          description: Queue entry ID. In this backend it is always equal to visitId.
        visitId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,120}$
          description: Visit ID.
        token:
          anyOf:
            - type: integer
              description: Front-desk token; null until checked in.
            - type: "null"
        status:
          $ref: "#/components/schemas/QueueStatus"
        date:
          $ref: "#/components/schemas/LocalDate"
        time:
          type: string
          description: Booked slot time HH:mm (IST).
        mode:
          type: string
          description: Walk-in, Video or Telephone.
        priority:
          type: boolean
        checkedInAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        startedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        completedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        returning:
          type: boolean
          description: True if the patient has an earlier completed visit or signed document at this hospital.
        lastVisitAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        priorDocumentCount:
          type: integer
          minimum: 0
        patient:
          $ref: "#/components/schemas/QueuePatient"
        vitals:
          anyOf:
            - $ref: "#/components/schemas/Vitals"
            - type: "null"
        demoWalkIn:
          type: boolean
